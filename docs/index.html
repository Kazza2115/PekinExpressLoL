<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pékin Express LoL</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%86%3C/text%3E%3C/svg%3E">
  <style>
    :root { --bg: #0b0e14; --card: #131824; --text: #e8ecf4; --muted: #8b93a7; --gold: #e5b64d; --red: #ef4444; }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
    main { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; }
    .card { width: 100%; max-width: 440px; background: var(--card); border: 1px solid rgba(255,255,255,.08); border-radius: 16px; padding: 28px 24px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.35); }
    h1 { margin: 0 0 4px; font-size: 1.6rem; letter-spacing: .01em; }
    h1 span { color: var(--gold); }
    p { margin: 10px 0 0; color: var(--muted); }
    .spinner { width: 36px; height: 36px; margin: 18px auto 4px; border-radius: 50%; border: 3px solid rgba(229,182,77,.25); border-top-color: var(--gold); animation: spin .9s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    a.btn { display: inline-block; margin-top: 16px; padding: 10px 18px; border-radius: 10px; background: var(--gold); color: #1b1405; font-weight: 600; text-decoration: none; word-break: break-all; }
    .error { color: var(--red); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
<main>
  <div class="card">
    <h1>🏆 Pékin Express <span>LoL</span></h1>
    <div class="spinner" id="spinner" aria-hidden="true"></div>
    <p id="status">Ouverture du site…</p>
    <a class="btn" id="link" href="#" hidden>Ouvrir le site</a>
    <p id="hint" hidden>Si la page ne s'ouvre pas, le PC de l'organisateur est sans doute éteint ou le site arrêté.</p>
  </div>
</main>
<script>
/* Lien fixe : lit l'adresse actuelle du site (docs/site.json, tenue à jour par le PC de
   l'organisateur à chaque lancement du tunnel) et y redirige aussitôt.
   #/duos, #/dashboard… dans le lien fixe ouvrent directement cette page du site. */
(function () {
  'use strict';
  var BRANCH = 'claude/quirky-pascal-y84evb';
  var owner = location.hostname.split('.')[0];
  var repo = location.pathname.split('/')[1] || 'PekinExpressLoL';
  var api = 'https://api.github.com/repos/' + owner + '/' + repo + '/contents/docs/site.json?ref=' + encodeURIComponent(BRANCH);
  var status = document.getElementById('status');
  var link = document.getElementById('link');
  var hint = document.getElementById('hint');
  var spinner = document.getElementById('spinner');

  function fail(message) {
    spinner.hidden = true;
    status.textContent = message;
    status.className = 'error';
  }

  function open(data) {
    var url = data && typeof data.url === 'string' ? data.url.replace(/\/+$/, '') : '';
    if (!/^https?:\/\//.test(url)) {
      fail("Le lien du site n'a pas encore été publié : l'organisateur doit lancer le site.");
      return;
    }
    var path = location.hash.indexOf('#/') === 0 ? location.hash.slice(1) : '/';
    var target = url + path;
    link.href = target;
    link.hidden = false;
    hint.hidden = false;
    location.replace(target);
  }

  function readJson(response) {
    if (!response.ok) throw new Error('HTTP ' + response.status);
    return response.json();
  }

  // API GitHub d'abord (toujours à jour), puis le fichier publié par GitHub Pages (quelques minutes de retard)
  fetch(api, { headers: { Accept: 'application/vnd.github.raw+json' }, cache: 'no-store' })
    .then(readJson)
    .catch(function () { return fetch('site.json?t=' + Date.now(), { cache: 'no-store' }).then(readJson); })
    .then(open)
    .catch(function () { fail("Impossible de lire l'adresse du site pour le moment. Réessaie dans une minute."); });
})();
</script>
</body>
</html>
